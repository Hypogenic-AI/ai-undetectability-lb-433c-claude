[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for AI Undetectability Leaderboard experiments"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.76.0",
    "bert-score>=0.3.13",
    "datasets>=4.5.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "openai>=2.15.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "transformers>=4.57.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
